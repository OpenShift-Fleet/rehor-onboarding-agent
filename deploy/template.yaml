apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rehor-onboarding-agent-dev
parameters:
- name: NAMESPACE
  value: ${NAMESPACE}
- name: BOT_IMAGE
  value: quay.io/redhat-services-prod/hcc-platex-services/rehor-onboarding-agent
- name: IMAGE_TAG
  required: true
- name: BOT_LABEL
  value: rehor-ai-onboarding-bot
- name: BOT_REPLICAS
  value: "0"
- name: BOT_INSTANCE_ID
  value: ""
- name: BOT_CONFIG_REPO
  value: ""
- name: BOT_NAME
  value: devbot-onboarding
- name: BOT_CONFIG_PATH
  value: ""
- name: GCP_PROJECT_ID
  required: true
- name: GCP_REGION
  required: true
- name: VERTEX_ALLOWED_MODELS
  required: true
- name: SLACK_WEBHOOK_URL
  value: ""
objects:

# Bot-only workload for the rehor-onboarding-agent-dev runner instance.
# The bot runs as an OpenShell agent-sandbox Sandbox (via SandboxWarmPool),
# not a Deployment. Shared infrastructure (proxy, memory-server, secrets) is
# deployed by the platform-frontend-ai-dev template in the same namespace.

# --- Sandbox workload (OpenShell / agent-sandbox) ---
# The bot runs as a SandboxWarmPool member (agents.x-k8s.io Sandbox), not a
# Deployment. A warm-pool member runs the image entrypoint immediately
# (Sandbox operatingMode defaults to Running); no SandboxClaim is involved.
# KEDA scales the pool's /scale subresource (see ScaledObject below):
# replicas=1 during the cron window = one running bot, replicas=0 off-window.
#
# NOTE (REHOR-119, migrate-first): securityContext is carried over unchanged
# from the prior Deployment. readOnlyRootFilesystem + writable-mount hardening
# is a tracked follow-up — this bot writes into /home/botuser/app at startup
# (git config via GIT_CONFIG_GLOBAL, skill merge into .claude, repo clones),
# so read-only root needs dedicated write-path mounts, not the generic PoC set.
#
# --- SandboxTemplate (pod blueprint referenced by the warm pool) ---
- apiVersion: extensions.agents.x-k8s.io/v1beta1
  kind: SandboxTemplate
  metadata:
    name: ${BOT_NAME}
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: ${BOT_NAME}
          app.kubernetes.io/component: bot
          app.kubernetes.io/part-of: devbot
      spec:
        containers:
        - name: bot
          image: ${BOT_IMAGE}:${IMAGE_TAG}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          env:
          - name: BOT_LABEL
            value: ${BOT_LABEL}
          - name: BOT_MEMORY_URL
            value: http://devbot-memory-server:8080/mcp
          - name: BOT_MEMORY_HEALTH_URL
            value: http://devbot-memory-server:8080/health
          - name: BOT_MEMORY_HEALTH_TIMEOUT
            value: "120"
          - name: CLAUDE_CODE_SKIP_VERTEX_AUTH
            value: "true"
          - name: ANTHROPIC_VERTEX_BASE_URL
            value: http://devbot-proxy:8443
          - name: ANTHROPIC_VERTEX_PROJECT_ID
            value: dummy-project
          - name: CLOUD_ML_REGION
            value: global
          - name: EXECUTOR_ADDR
            value: devbot-proxy:9090
          - name: HUSKY
            value: "0"
          - name: GH_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gh-username
          - name: GH_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-email
          - name: GL_USER_NAME
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-name
          - name: GL_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: bot-gl-email
          - name: BOT_JIRA_EMAIL
            valueFrom:
              secretKeyRef:
                name: devbot-secrets
                key: jira-email
          - name: BOT_INSTANCE_ID
            value: ${BOT_INSTANCE_ID}
          - name: BOT_CONFIG_REPO
            value: ${BOT_CONFIG_REPO}
          - name: BOT_CONFIG_PATH
            value: ${BOT_CONFIG_PATH}
          - name: BOT_DASHBOARD_URL
            value: http://devbot-memory-server:8080/api/bot-status
          - name: COSTS_API_URL
            value: http://devbot-memory-server:8080/api/costs
          - name: SLACK_WEBHOOK_URL
            value: ${SLACK_WEBHOOK_URL}
          - name: PROXY_HOST
            value: devbot-proxy
          - name: HTTP_PROXY
            value: http://devbot-proxy:3128
          - name: HTTPS_PROXY
            value: http://devbot-proxy:3128
          - name: http_proxy
            value: http://devbot-proxy:3128
          - name: https_proxy
            value: http://devbot-proxy:3128
          - name: NO_PROXY
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          - name: no_proxy
            value: devbot-memory-server,devbot-proxy,localhost,127.0.0.1
          - name: JIRA_MCP_URL
            value: http://devbot-proxy:8444/mcp
          - name: GH_RELEASE_UPLOAD_URL
            value: http://devbot-proxy:8446/upload
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 8Gi

# --- SandboxWarmPool (KEDA scale target; each replica = one running bot) ---
- apiVersion: extensions.agents.x-k8s.io/v1beta1
  kind: SandboxWarmPool
  metadata:
    name: ${BOT_NAME}
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/component: bot
      app.kubernetes.io/part-of: devbot
  spec:
    # KEDA owns this at runtime via the /scale subresource; the initial value
    # mirrors the prior Deployment (0 = scaled down until the cron window).
    replicas: ${{BOT_REPLICAS}}
    sandboxTemplateRef:
      name: ${BOT_NAME}

# --- NetworkPolicy: Bot can only reach proxy + memory-server ---
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: ${BOT_NAME}-egress
    labels:
      app.kubernetes.io/part-of: devbot
  spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ${BOT_NAME}
    policyTypes:
    - Egress
    egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: devbot-proxy
      ports:
      - port: 3128
        protocol: TCP
      - port: 9090
        protocol: TCP
      - port: 8443
        protocol: TCP
      - port: 8444
        protocol: TCP
      - port: 8446
        protocol: TCP
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: memory-server
      ports:
      - port: 8080
        protocol: TCP
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-dns
      ports:
      - port: 5353
        protocol: UDP
      - port: 5353
        protocol: TCP

# --- Cron Scaler ---
- apiVersion: keda.sh/v1alpha1
  kind: ScaledObject
  metadata:
    name: ${BOT_NAME}-cron-scaler
    labels:
      app.kubernetes.io/name: ${BOT_NAME}
      app.kubernetes.io/part-of: devbot
  spec:
    scaleTargetRef:
      apiVersion: extensions.agents.x-k8s.io/v1beta1
      kind: SandboxWarmPool
      name: ${BOT_NAME}
    minReplicaCount: 0
    maxReplicaCount: 1
    triggers:
    - type: cron
      metadata:
        timezone: "America/New_York"
        start: "0 9 * * 1-5"
        end: "0 18 * * 1-5"
        desiredReplicas: "1"
